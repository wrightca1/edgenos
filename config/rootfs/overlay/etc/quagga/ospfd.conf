hostname edgenos-ospf
log syslog
!
! VTY password — enables the read-only telnet management interface on port 2604
! ("show ip ospf neighbor", etc.). View mode (no enable) allows show commands
! only. NOTE: ospfd binds the VTY on 0.0.0.0:2604, so this is reachable from the
! network — keep it a distinct, non-root credential (NOT the box root password).
password zebra
!
interface lo
!
! OSPF cost = path metric; lower is preferred. Costs are set explicitly because
! the swp* ports are TUN interfaces with no kernel-known speed, so auto-cost
! reference-bandwidth cannot infer 40G vs 10G. The 1:4 ratio mirrors bandwidth:
!   swp49 (40G uplink to Nexus .17) -> cost 10  = PRIMARY (higher priority)
!   swp1/swp2 (10G uplinks)         -> cost 40  = equal-cost ECMP backup pair
! Result: traffic prefers the 40G path; if it drops, the two 10G links ECMP.
interface swp49
 ip ospf cost 10
!
interface swp1
 ip ospf cost 40
!
interface swp2
 ip ospf cost 40
!
router ospf
 ospf router-id 10.101.101.241
 passive-interface lo
 network 10.101.101.0/29 area 0
 network 10.101.101.8/29 area 0
 network 10.101.101.16/29 area 0
 network 10.101.101.241/32 area 0
!
