# swp-addrs.conf - persistent L3 addresses for front-panel swp ports.
# Applied at boot by swp-l3.service (after edged creates the swpN tap interfaces).
# edged programs the L3 local-host CPU-punt automatically via its live
# RTM_NEWADDR netlink handler, so no edged restart is needed.
#
# Format (one per line):  <iface> <addr/prefixlen> [mtu]
# Lines starting with # and blank lines are ignored.
#
# Values from the AS5610 Cumulus /etc/network/interfaces (Nexus uplinks).
swp1  10.101.101.1/29  1600
swp2  10.101.101.10/29 1600
swp49 10.101.101.18/29 1600
lo    10.101.101.241/32
