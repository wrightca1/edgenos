# EdgeNOS L2 forwarding groups
#
# Each non-comment line defines one L2 group:
#
#     <vid> <portA> <portB> [portC ...]
#
# The listed front ports are placed into a single VLAN <vid> and forward
# directly to each other in hardware (one L2 broadcast domain, MAC-learned).
# They are pulled OFF their per-port L3 service VLANs, so they are isolated
# from the L3-routed ports and from any other group.
#
# - <vid> must be 2-4094 and NOT in the reserved range 3300-3999.
# - Ports may be written "swp10" or just "10".
# - Ports not listed in any group keep the default per-port L3 behavior.
#
# Applied by edged at startup (after the per-port service VLANs are built).
# Edit this file then restart edged (or reboot) to apply.
#
# Example: bridge swp10, swp11, swp12 into one L2 segment on VLAN 100:
#   100 swp10 swp11 swp12
#
# (no groups configured by default)
