# swp-routes.conf - persistent transit / ECMP routes, applied at boot by
# swp-l3.service (after swp addresses are set). Multiple gateways = ECMP:
# edged builds an L3_ECMP group so the chip load-balances flows across the
# listed swp ports.
#
# Format (one route per line):
#   <dst/prefixlen>   <gw1>:<dev1>  [<gw2>:<dev2> ...]
# Lines starting with # and blank lines are ignored.
#
# Both 10G uplinks go to the same Nexus (swp1->.2, swp2->.9); this 2-way ECMP
# route load-balances traffic to 10.200.200.0/24 across both. Replace the prefix
# with your real downstream network(s). Do NOT put a default route via the swp
# uplinks here unless you intend it — it would override management routing.
10.200.200.0/24  10.101.101.2:swp1  10.101.101.9:swp2
