# swp-routes.conf - persistent transit / ECMP routes, applied at boot by
# swp-l3.service (after swp addresses are set). Multiple gateways = ECMP:
# edged builds an L3_ECMP group so the chip load-balances flows across the
# listed swp ports.
#
# Format (one route per line):
#   <dst/prefixlen>   <gw1>:<dev1>  [<gw2>:<dev2> ...]
# Lines starting with # and blank lines are ignored.
#
# Real downstream networks are normally learned dynamically via OSPF (and will
# prefer the 40G uplink per the ip ospf cost settings), so this file is empty by
# default. Add a line here only for a STATIC ECMP/transit route, e.g.:
#   192.0.2.0/24  10.101.101.2:swp1  10.101.101.9:swp2
# Do NOT put a default route via the swp uplinks here unless you intend it — it
# would override management routing.
