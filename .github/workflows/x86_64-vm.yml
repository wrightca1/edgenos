# EdgeNOS x86_64 virtual switch — build from this repo alone and boot-test it.
#
# The virtual platform needs no vendor SDK, no cross toolchain and none of the external
# source trees, so it is the one target that can be built end to end here:
#   switch DB validate -> Buildroot base (cached by defconfig hash) -> quagga -> edged-vswitch
#   -> .epk packages -> ONIE installer + qcow2 -> qemu smoke test (BIOS, then UEFI)
name: x86_64-vm

on:
  push:
    branches: [master, main]
    paths:
      - 'arch/x86_64/**'
      - 'asic/vswitch/**'
      - 'platform/qemu-kvm-x86_64/**'
      - 'switchdb/**'
      - 'packaging/**'
      - 'core/**'
      - 'build/build-*x86_64*.sh'
      - 'build/build-vm-image.sh'
      - 'images/x86_64-*.yml'
      - 'tools/qemu/**'
      - '.github/workflows/x86_64-vm.yml'
  pull_request:
  workflow_dispatch:

jobs:
  vm-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk (Buildroot needs ~15 GB while building)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Host dependencies (Buildroot + genimage + qemu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison gawk libncurses-dev libssl-dev libelf-dev \
            cpio rsync bc unzip file wget patch perl python3 python3-yaml python3-jsonschema \
            qemu-system-x86 qemu-utils ovmf squashfs-tools dosfstools mtools
          # let the runner user use KVM (GitHub's Linux runners expose /dev/kvm)
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no KVM: the smoke test will run under TCG (slow)"

      - name: Switch DB
        run: bin/edgenos db validate && bin/edgenos db show x86_64-kvm_x86_64-r0

      - name: Cache Buildroot output (trimmed - host tools, target, images, stamps, downloads)
        uses: actions/cache@v4
        with:
          path: |
            output/br-x86_64
            ../buildroot
          key: br-x86_64-${{ hashFiles('arch/x86_64/buildroot/**', 'build/build-base-x86_64.sh') }}
          restore-keys: br-x86_64-

      - name: Build everything (base, quagga, edged-vswitch, packages, image)
        env:
          BR_TRIM: "1"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          build/build-vm-image.sh
          df -h / | tail -1

      - name: Smoke test (BIOS)
        run: tools/qemu/smoke-test.py output/images/EdgeNOS-*-x86_64-kvm_x86_64-r0.qcow2 -n 3 --port 4555

      - name: Smoke test (UEFI)
        run: tools/qemu/smoke-test.py output/images/EdgeNOS-*-x86_64-kvm_x86_64-r0.qcow2 -n 3 --port 4556 --uefi

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: edgenos-x86_64-kvm
          path: |
            output/images/EdgeNOS-*-x86_64-kvm_x86_64-r0.qcow2
            output/images/EdgeNOS-*-x86_64-kvm_x86_64-r0.bin
            output/packages/*.epk
          if-no-files-found: error
