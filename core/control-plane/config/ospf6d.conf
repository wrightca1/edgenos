! EdgeNOS OSPFv3 (IPv6) — learns v6 routes; zebra installs them to the kernel FIB,
! edged then mirrors them to the chip L3_DEFIP_128 table.
hostname ospf6d
password zebra
log syslog
!
! ── Default image ships NO site OSPFv3 ──────────────────────────────────────
! The front-panel swp* ports are unaddressed by default (see
! platform/accton-as5610-52x/config/swp-addrs.conf), so there is nothing to
! advertise and no `router ospf6` stanza here. ospf6d still starts (VTY on 2606,
! idle).
!
! Our site configuration — router-id and the participating
! `interface swpN area 0.0.0.0` lines — lives in
! platform/accton-as5610-52x/deploy/ospf6d.conf and is applied per deployment,
! alongside deploy/swp-addrs.conf. Keep site addressing OUT of this file so a
! clean build stays clean.
!
