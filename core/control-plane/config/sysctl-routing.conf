# EdgeNOS: kernel routing knobs.
#
# The ASIC does the forwarding, but the kernel still has to forward everything
# the chip punts to the CPU: slow-path L3 (TTL expiry, MTU/fragmentation, ICMP
# errors), traffic to next-hops the chip has not resolved yet, and every route
# the hardware tables could not hold. With ip_forward=0 those packets are
# silently discarded as martians -- /proc/net/snmp shows ForwDatagrams=0 and a
# climbing InAddrErrors -- so an ASIC-forwarding gap becomes a total blackhole
# instead of a slow path.
#
# Found on the AS5610-52X 2026-08-21: ip_forward was 0 (nothing in the image
# ever set it) while IPv6 forwarding was on, so v6 transit fell back to the CPU
# and v4 transit was dropped outright.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
