hostname edgenos-ospf
log syslog
!
! VTY password — enables the read-only telnet management interface on port 2604
! ("show ip ospf neighbor", etc.). View mode (no enable) allows show commands
! only. NOTE: ospfd binds the VTY on 0.0.0.0:2604, so this is reachable from the
! network — keep it a distinct, non-root credential (NOT the box root password).
password zebra
!
! ── Default image ships NO site OSPF ────────────────────────────────────────
! The front-panel swp* ports are unaddressed by default (see
! platform/accton-as5610-52x/config/swp-addrs.conf), so there is nothing to
! advertise and no `router ospf` stanza here. ospfd still starts (VTY up, idle).
!
! Our site configuration — router-id, area networks and per-interface costs —
! lives in platform/accton-as5610-52x/deploy/ospfd.conf and is applied per
! deployment, alongside deploy/swp-addrs.conf. Keep site addressing OUT of this
! file so a clean build stays clean.
!
! When writing a deployment config, note: swp* are TUN interfaces with no
! kernel-known speed, so auto-cost reference-bandwidth cannot infer 40G vs 10G.
! Set `ip ospf cost` explicitly — we use 10 for the 40G uplink and 40 for the
! 10G links (1:4, mirroring bandwidth), so traffic prefers the 40G path and the
! 10G links act as an equal-cost ECMP backup pair.
!
