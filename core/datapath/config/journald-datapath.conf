# EdgeNOS: bound what the datapath daemon can do to the journal.
#
# The datapath links against a vendor SDK we do not control, and an unhappy
# chip makes it chatty in a tight poll loop -- on the AS5610-52X a repeating
# CMICm DMA-timeout message grew the journal to 369 MB, burned ~11% of a core
# in journald, and compressed retained history to about 45 minutes, which threw
# away the boot-time init log that would have explained the fault.
#
# Cap the on-flash size so a flood cannot eat the rootfs, and rate-limit so it
# cannot evict the history you need to debug it. journald logs a "Suppressed N
# messages" line when it trims, so the flood itself stays visible.
[Journal]
SystemMaxUse=64M
SystemMaxFileSize=8M
RateLimitIntervalSec=30s
RateLimitBurst=3000
