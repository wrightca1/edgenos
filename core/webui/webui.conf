# EdgeNOS web UI configuration
port=8090
# Management interface to bind to. Empty = auto-detect (ma1, eth0, end0, ...).
interface=
# Bind to ALL interfaces (0.0.0.0) instead of mgmt-only. This is the explicit
# opt-in to expose the UI beyond the management interface. 1 = yes.
allow_all=0
# Quagga ospfd vty password (for the OSPF module).
ospf_vty_password=zebra
