# EdgeNOS CPU architecture: ARM 32-bit soft-float (Marvell Feroceon, ARMv5TE)
# Used by: juniper-ex2200-c-12t-2g
id: armv5te
name: ARM 32-bit soft-float (Marvell Feroceon 88FR131, ARMv5TE)
triple: arm-linux-gnueabi
endian: little
bits: 32
cpu: marvell-f
kernel_arch: arm
kernel_defconfig: mvebu_v5_defconfig
cflags:
  - -march=armv5te
  - -mtune=marvell-f
  - -mfloat-abi=soft
quirks:
  - "No hardware FPU. Soft-float ABI (gnueabi, not gnueabihf) - not interchangeable with the armhf toolchain used by the AS4610."
  - "ARMv5TE predates LPAE and the ARM generic timer; mvebu_v5 is a separate defconfig lineage from mvebu_v7."
  - "Kirkwood BootROM accepts a kwbimage over the integrated UART (xmodem), so kwboot can run a bootloader from RAM without touching flash."
notes: >
  Marvell Kirkwood 88F6281 (Feroceon 88FR131 / Sheeva core), 800 MHz, 512 MB DRAM.
  Fully supported by mainline Linux under arch/arm/mach-mvebu; current trees carry
  102 Kirkwood device trees including kirkwood-6281.dtsi. Peripheral drivers all
  exist upstream: mv643xx_eth, orion-gpio, i2c-mv64xxx, ehci-orion, orion_wdt,
  mvebu irqchip/timer. Confirmed on hardware: the kernel names the SoC directly as
  "Marvell 88F6281 PCI-Express host controller".
