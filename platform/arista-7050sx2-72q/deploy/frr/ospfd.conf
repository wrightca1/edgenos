! OSPF over both routed ports, presented to Linux by the SDK TAP bridge.
!
!   et1 (xe0, VLAN 1006, 10.101.101.42/29) -> AS5610 swp8 (10.101.101.41)
!   et2 (xe1, VLAN 1007, 10.101.101.57/29) -> Cisco Nexus (10.101.101.58)
!
! The AS5610's own config (/etc/quagga/ospfd.conf there) is
!   router-id 10.101.101.241, area 0.0.0.0, network 10.101.101.40/29,
!   swp8 "ip ospf cost 40", no authentication.
hostname edgenos-ospf
log stdout
!
interface et1
 ip ospf cost 40
!
! MTU-IGNORE ON THE NEXUS LINK, DELIBERATELY.
!
! OSPF carries the interface MTU in its Database Description packets and each
! side rejects a mismatch -- which does not fail loudly, it parks the adjacency
! in ExStart forever with Hellos flowing perfectly in both directions. That cost
! a debugging session on et1 (1500 against the 5610's 1600).
!
! et1 is safe because both ends are known to be 1600. The Nexus's MTU is NOT
! known here, so rather than guess and re-learn the same lesson, ignore the
! check on this link. Remove this once the far end's MTU is confirmed and the
! two are set to match.
interface et2
 ip ospf mtu-ignore
!
router ospf
 ospf router-id 10.101.101.42
 network 10.101.101.40/29 area 0.0.0.0
 network 10.101.101.56/29 area 0.0.0.0
! ⚠ CHANGE THIS. `zebra` is FRR's conventional example password and is
! only here because these files are the ones the published measurements
! were taken with. The vty listens on localhost, but do not ship it.
password zebra
enable password zebra
!
line vty
 no login
!
