! OSPFv3 over both routed ports, presented to Linux by the SDK TAP bridge.
!
! Matched to the AS5610's quagga ospf6d (/etc/quagga/ospf6d.conf there):
!   router-id 10.101.101.241, swp8 in area 0.0.0.0, "ipv6 ospf6 network
!   broadcast". Our side of that link is 2001:470:882d:1040::1/64.
!
! The router-id is an IPv4-formatted 32-bit value even for OSPFv3, and it must
! not collide with the v4 process or the far end -- 10.101.101.42 is ours in
! both, which is what the AS5610 already knows us as.
hostname edgenos-ospf6
log stdout
!
interface et1
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network broadcast
!
! MTU-IGNORE ON THE NEXUS LINK -- same reasoning as ospfd.conf. OSPFv3 carries
! the MTU in its Database Description packets exactly as OSPFv2 does, and a
! mismatch parks the adjacency in ExStart with Hellos flowing both ways. The
! Nexus's MTU is not known here.
interface et2
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network broadcast
 ipv6 ospf6 mtu-ignore
!
router ospf6
 ospf6 router-id 10.101.101.42
!
password zebra
enable password zebra
!
line vty
 no login
!
