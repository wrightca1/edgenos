# swp-addrs.conf — persistent L3 addresses for AS5610 front-panel swp ports.
# Applied at boot by swp-l3.service (after edged creates the swpN tap devices).
#
# The default image ships with NO front-panel IPs (clean image — only the mgmt
# port is addressed, via DHCP). Configure per deployment; see ../deploy/ for our
# site values. Format (one per line):  <iface> <addr/prefixlen> [mtu]
