# AS5610 site deployment ("our config") — apply on top of the clean default image.
# The default image deliberately ships no front-panel IPs; this is the site overlay.
#
# Columns: <iface> <addr/prefix> [mtu]
#
# MTU 1600 is not cosmetic. OSPF carries the interface MTU in Database Description
# packets and will not leave Exchange on a mismatch, so every routed link here must
# agree with its peer — the Arista 7050TX-64's Ethernet52/1 and the Nexus ports are
# all set to 1600 for exactly this reason.
#
# Anything NOT listed here is lost the next time edged restarts: edged recreates the
# swpN TAP devices from scratch, and swp-l3-config.sh only re-applies what is in this
# file. Configure links here, never by hand with `ip addr add`.

# v4 — Nexus uplinks swp1/swp2 (10G) + swp49 (40G, primary), the Arista 7050TX-64 on
# swp52 (40G), the AS4610 on swp4, and the loopback / OSPF router-id.
swp1   10.101.101.1/29    1600
swp2   10.101.101.10/29   1600
swp4   10.101.102.1/29    1600
swp5   10.99.99.1/24      1600
swp6   10.101.101.25/29   1600
swp7   10.101.101.33/29   1600
swp8   10.101.101.41/29   1600
swp49  10.101.101.18/29   1600
swp52  10.101.101.49/29   1600
lo     10.101.101.241/32

# v6
swp1   2001:470:882d:1012::2/64
swp2   2001:470:882d:1019::2/64
swp4   2001:470:882d:102::1/64
swp6   2001:470:882d:1024::2/64
swp7   2001:470:882d:1032::2/64
swp8   2001:470:882d:1040::2/64
swp49  2001:470:882d:1117::2/64
lo     2001:470:882d:1111::241/128
