! EdgeNOS OSPFv3 (IPv6) for the AS4610 — bcmd mirrors learned v6 routes to the chip
! (L3 host/route via the SDK with BCM_L3_IP6). OSPFv3 assigns whole interfaces to an
! area (it runs per-link over IPv6 link-local). Interface names are the bcmd SDK
! netdevs (copper geN, SFP+ xeN) — see PORTMAP.md; adjust to the ports you route on
! (mirrors the v4 ospfd.conf: copper front + the SFP+ uplink).
hostname as4610-ospf6d
password zebra
router ospf6
 router-id 10.14.1.2
 interface xe0 area 0.0.0.0
 interface ge25 area 0.0.0.0
