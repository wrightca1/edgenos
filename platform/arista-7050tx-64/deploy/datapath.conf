# EdgeNOS datapath and routing, for the DCS-7050TX-64.
#
# Deploy to /mnt/flash/datapath.conf. It lives on FLASH rather than in the image
# so the box can be reconfigured without rebuilding and reflashing a SWI.
#
# Read at boot by /bin/datapath-up.sh, which init launches in the BACKGROUND --
# nothing here can delay or block a boot.

# ⚠ OFF by default. A plain boot stays ASIC-dark, which is the safety property
# this project has kept from the start: booting EdgeNOS must never perturb the
# chip unless asked. Set yes when you want the box to come up routing.
enable=no

# The SDK agent and its chip configuration. NOT shipped in the image: the agent
# is ~170 MB and the initrd is a ramdisk, so it would cost that much RAM on
# every boot, including boots that never touch the ASIC. Put both on flash.
#
# ⚠ config.bcm is not shipped either, and must be generated on this switch --
# see the platform README. Without it the SDK cannot attach at all.
agent=/mnt/flash/edgenos/sdkpoc
config=/mnt/flash/edgenos/config-52port.bcm

# Ports to give a Linux tap interface, by SDK port number. Ranges allowed.
#
# This is the whole front panel: 48x 10GBASE-T on ports 1-48, and the four QSFP+
# cages at 40G on ports 49, 53, 57 and 61. Each 40G port is the FIRST lane of its
# group of four, which is why the QSFP numbers are not consecutive.
#
# ⚠ That requires config-52port.bcm above. The captured config.bcm has three of
# the four cages broken out as 4x10G, giving 61 ports rather than 52 -- a
# configuration the chip will happily run, but not what this box physically is.
ports=1-48,49,53,57,61

# routed = one VLAN and one L3 interface per port, matching how EOS runs these.
# l2 = plain switching between the ports instead.
portmode=routed

# Bring up ports cabled AFTER the agent starts. Default yes.
#
# ⚠ Without this a port is configured only if it has a link during the single
# startup pass, ten seconds after the ports are enabled. Plug a cable in later
# and the port gets no MAC interface, no VLAN and no L3 interface -- and the
# symptom is indistinguishable from a broken cable: link negotiates, both ends
# transmit, neither receives, zero errors on both sides. That cost an afternoon
# on front-panel port 42 before the cause was found; see
# docs/COPPER-PORT-RX-DEAD.md (2026-08-26).
#
# Set no to disable. It runs a handler on the linkscan thread, and the last
# code to do that took the copper datapath down with it, so it is switchable
# without a rebuild.
hotplug=yes

# Mirror the kernel routing table into the chip, so traffic crosses the box in
# hardware rather than through the CPU.
fibsync=yes

# ⚠ phybus drives the 48 copper PHYs, and bcm_init with it enabled is currently
# UNRELIABLE -- two runs in five completed, three stalled with the log frozen.
#
# Without it the copper ports still EXIST -- they get chip ports and Linux
# netdevs and appear in `ps` -- but they will never link, because the SDK binds
# the internal TSC SerDes instead of the external BCM84848 PHY. So "all 52 ports
# available" is true either way; "all 52 ports able to carry traffic" needs this.
# The four 40G QSFP ports do not.
phybus=no

# Start the routing daemons once the interfaces are addressed.
frr=yes

# A stable address that no link flap can take away.
#
# ⚠ Until now the OSPF router-id was 10.101.101.50 -- xe60's own address. That
# works until xe60 goes down, at which point the router-id names an unreachable
# interface and anything addressed to it is lost. A loopback fixes both: it is
# the router-id AND a management address that survives any single link.
#
# It lives on `lo` rather than a dummy interface because this kernel has
# CONFIG_DUMMY off. `lo` is never down, which is the property that matters.
loopback=10.101.255.50/32

# IPv6 router-id address, same role: a stable address that survives any one
# interface going down.
loopback6=2001:470:882d:255::50/128

# Source-based policy routing: policy <from-prefix> <to-prefix> <via> <dev>
#
# ⚠ Why this exists. init pins a static route for the management network via
# eth0, so that OSPF converging can never steal the path this box is reached on
# -- that is not paranoia, it is what lost the box once. But a static beats OSPF
# on distance, so replies to fabric hosts ALSO went out eth0: a packet arriving
# on the 40G link was answered via management, and that asymmetric path was
# dropped upstream.
#
# The symptom pointed at the wrong box entirely -- it looked like the Nexus was
# not forwarding, when the Nexus was forwarding perfectly (21 packets arrived on
# xe56 during 20 pings) and we were replying out of the wrong interface.
#
# This rule splits by SOURCE: traffic from a fabric address to the management
# network goes back through the fabric, while anything sourced from the
# management address keeps eth0. Both paths stay symmetric and the pin survives.
policy 10.101.0.0/16 10.22.1.0/24 10.101.106.2 xe56
policy 10.101.0.0/16 10.22.1.0/24 10.101.103.2 xe47

# Interfaces: iface <name> <mac> <address/prefix> <mtu>
#
# ⚠ The MTU matters and is not cosmetic. OSPF carries it in Database Description
# packets and refuses to leave Exchange on a mismatch; both neighbours here
# advertise 1600, and a 1500 interface silently never forms an adjacency. That
# cost real time twice -- once on the 40G link and again on copper, where it was
# invisible until FRR's neighbour table exposed it.
iface xe60 02:1c:73:00:00:3d 10.101.101.50/29 1600
iface xe47 02:1c:73:00:00:30 10.101.103.1/29 1600

# The Juniper EX2200. Port 46 goes to its last uplink, port 47 to its management
# port -- which is why xe46 negotiates 100M while xe45 comes up at 1G. That speed
# difference is a useful check that these are the ports you think they are.
#
# ⚠ MTU 1500 here, NOT the 1600 the two links above use. An EX2200 will not take
# jumbo on its management port, and an MTU mismatch does not fail loudly -- OSPF
# sits in Exchange for ever and the interface looks perfectly healthy. That has
# cost this project time twice.
iface xe42 02:1c:73:00:00:2b 10.101.108.1/29 1500
iface xe44 02:1c:73:00:00:2d 10.101.107.1/24 1500
iface xe45 02:1c:73:00:00:2e 10.101.105.1/29 1500
iface xe46 02:1c:73:00:00:2f 10.101.104.1/29 1500

# Second link to the Nexus, 40G on front-panel Ethernet51.
#
# Front-panel QSFP to SDK port, derived from the FDL's warp-core numbers
# (Et49->25, Et50->24, Et51->26, Et52->27) and the lane ranges each covers:
#   Et49 = port 49   Et50 = port 53   Et51 = port 57   Et52 = port 61
# It self-checks: Et52 lands on port 61, which is the AS5610 link.
#
# mtu 1600 to match the other Nexus link -- the Nexus advertises 1600, and a
# 1500 interface would sit in OSPF Exchange for ever looking perfectly healthy.
iface xe56 02:1c:73:00:00:39 10.101.106.1/29 1600
