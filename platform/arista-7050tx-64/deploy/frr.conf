! FRR integrated configuration for the 7050TX-64 under EdgeNOS.
!
! This replaces the static Quagga 1.2.4 build that stood in for FRR earlier.
! FRR was what was asked for; Quagga was substituted because the initrd had no
! libc and static-linking FRR's libyang2/pcre2/json-c chain is painful. The
! image now carries a real glibc (tools/build-frr.sh), so stock FRR runs
! unmodified and the substitution is gone.
!
! Matched to the AS5610 at the far end: router-id 10.101.101.241, area 0.0.0.0,
! swp52 "ip ospf cost 10", no authentication, already advertising
! 10.101.101.48/29. Our side of that /29 is 10.101.101.50 -- the address EOS
! used on this port.
frr defaults traditional
hostname edgenos-7050tx64
log stdout
service integrated-vtysh-config
!
! Ethernet52/1 -- SDK port 61, presented to Linux as "xe60" by the tap bridge in
! sdkpoc (docs/IP-CONNECTIVITY.md). The 40G link to the AS5610.
!
! ⚠ mtu 1600 matters and is not cosmetic: OSPF carries the interface MTU in
! Database Description packets and refuses to leave Exchange on a mismatch. The
! peer's swp52 is 1600, and EOS's own config had mtu 1600 on Ethernet52/1 for
! exactly this reason. The interface MTU itself is set by init, not here.
! ⚠ 500, not 10, and deliberately so. This is the BACKUP uplink: everything
! prefers xe56 to the Nexus (cost 10) and falls back here. Previously both were
! 10 and xe60 lost only because the topology made it longer -- which is fragile,
! because a topology change could make them equal-cost and start load-sharing
! across a path that is not equivalent.
!
! Verified as a real backup, not a hopeful one: with xe56 made expensive, all 36
! routes move here with correct metrics (the 5610's own 10.101.102.0/29 lands at
! 41 = our 1 + its advertised 40), and move back when the cost is restored.
!
! ⚠⚠ FRR DID NOT RECOMPUTE SPF ON A COST CHANGE. Raising xe56 to 5000 and
! dropping xe60 to 1 changed the advertised metrics in our router-LSA and moved
! NOTHING -- the table still showed every route via xe56 at 5044 when the path
! via xe60 cost 41. "clear ip ospf process" fixed it instantly. So after
! changing a cost, check the table actually moved; if it has not, clear the
! process. A link failure raises an interface event and does trigger SPF, so
! this affects planned changes rather than real failover -- but it is exactly
! the trap that makes an untested backup look like a broken one. It cost an
! hour here and produced a confident, wrong conclusion that the 5610 could not
! provide redundancy at all.
interface xe60
 ip ospf cost 500
 ipv6 ospf6 cost 500
!
! Ethernet48 -- SDK port 48, xe47, the 10GBASE-T copper link to the Nexus.
! EOS ran 10.101.103.1/29 with cost 40 here.
interface xe47
 ip ospf cost 40
!
! The Juniper EX2200: xe45 to its last uplink, xe46 to its management port.
! Higher costs than the two transit links -- these are edge attachments, not
! paths we want transit traffic to prefer.
interface xe45
 ip ospf cost 100
!
! xe46 is PASSIVE -- see the router stanza. The cost is kept for the day it
! stops being passive; it has no effect while it is.
interface xe46
 ip ospf cost 200
!
! Ethernet51 -- the second, 40G link to the Nexus. Same cost as the other 40G
! transit link so the two are equal-cost rather than one being a backup.
interface xe56
 ip ospf cost 10
!
router ospf
 ! ⚠ The router-id is the LOOPBACK, not an interface address. It used to be
 ! 10.101.101.50, which is xe60's own address -- fine until xe60 flaps, at which
 ! point the id names an interface that is down. A router-id should not depend
 ! on any single link staying up.
 ospf router-id 10.101.255.50
 network 10.101.255.50/32 area 0.0.0.0
 network 10.101.101.48/29 area 0.0.0.0
 network 10.101.103.0/29 area 0.0.0.0
 network 10.101.106.0/29 area 0.0.0.0
!
! The PDU segment on Ethernet45 (xe44). A device network rather than a
! point-to-point link, so a /24: an APC AP7900B switched rack PDU lives at
! 10.101.107.10 and there is room for more infrastructure without renumbering.
! Advertised so the PDU is reachable from the whole fabric -- outlet control is
! exactly the thing you want working when the data plane is not.
 network 10.101.107.0/24 area 0.0.0.0
 network 10.101.105.0/29 area 0.0.0.0
 network 10.101.104.0/29 area 0.0.0.0
 !
 ! ⚠ xe46 reaches the EX2200's MANAGEMENT port. Its subnet should be reachable
 ! from the rest of the network, but the box must not try to form an adjacency
 ! across a management link -- nothing on the far side speaks OSPF, and an
 ! interface sending hellos into a management port is noise at best.
 !
 ! passive-interface is precisely that distinction: the network statement above
 ! keeps 10.101.104.0/29 in our router LSA so the AS5610 and the Nexus learn it,
 ! while no hellos are sent or accepted on the interface itself.
 !
 ! The alternative -- dropping the network statement and using
 ! "redistribute connected" -- would also advertise it, but as an EXTERNAL (E2)
 ! route carrying every other connected subnet with it. This keeps it intra-area
 ! and keeps the blast radius to the one interface.
 passive-interface xe46
 ! Nothing to peer with on a loopback; advertise it, do not send hellos at it.
 passive-interface lo
!
line vty
!
!
! ---------------------------------------------------------------- OSPFv3 ---
! IPv6 rides the same fabric links as v4. OSPFv3 forms adjacencies over
! LINK-LOCAL addresses, so no global addressing is needed to get routing up --
! which is why this works on interfaces that carry only a v4 global address.
!
! ⚠ ospf6d must be enabled in `daemons`. Configuring it through vtysh while it
! is set to `no` there appears to work and is NOT saved by `write memory`:
! vtysh never queries a daemon it does not know about, so the config lives only
! in the running process and a restart comes up empty.
router ospf6
 ospf6 router-id 10.101.255.50
!
interface lo
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 passive
!
interface xe47
 ipv6 ospf6 area 0.0.0.0
!
interface xe56
 ipv6 ospf6 area 0.0.0.0
!
! ⚠ mtu-ignore is REQUIRED here, and the reason is not obvious. This adjacency
! sat in ExStart for hours and the far end looked guilty -- it appeared to send
! hellos and nothing else. It was not: its database descriptions were reaching
! the wire and being dropped before the CPU, because IPv6 addressed to this
! switch had no chip entry at all (see IPV6-STATE.md). Fix that, the DD packets
! appear, and only THEN does the real MTU mismatch with the 5610 surface.
!
! The lesson is about the earlier test, not the setting: mtu-ignore was tried
! early, changed nothing, and was written off as ruled out. It had never been
! tested, because the packets it applies to were not arriving yet. A negative
! result from a test that could not have worked is not a negative result.
interface xe60
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 mtu-ignore
