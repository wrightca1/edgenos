# EdgeNOS GRUB menu — lives on the EDGENOS-BOOT partition as /grub/grub.cfg.
# Reached from the embedded early config (search --label EDGENOS-BOOT). Serial + VGA.
set default=0
set timeout=3
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

search --no-floppy --label EDGENOS-BOOT --set=root

menuentry "EdgeNOS @VERSION@ (@PLATFORM@)" {
    linux  /edgenos/bzImage console=tty0 console=ttyS0,115200n8 net.ifnames=0 edgenos.boot=LABEL=EDGENOS-BOOT edgenos.data=LABEL=EDGENOS-DATA
    initrd /edgenos/initrd.img
}

menuentry "EdgeNOS @VERSION@ — rescue (shell in initramfs before switch_root)" {
    linux  /edgenos/bzImage console=tty0 console=ttyS0,115200n8 net.ifnames=0 edgenos.boot=LABEL=EDGENOS-BOOT edgenos.data=LABEL=EDGENOS-DATA edgenos.debug
    initrd /edgenos/initrd.img
}

# Present only when installed through ONIE (the ONIE-BOOT partition exists).
if search --no-floppy --label ONIE-BOOT --set=onie; then
    menuentry "ONIE" {
        search --no-floppy --label ONIE-BOOT --set=root
        configfile /grub/grub.cfg
    }
fi
