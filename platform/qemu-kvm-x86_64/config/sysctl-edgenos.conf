# EdgeNOS virtual switch (datapath: none — the kernel IS the forwarding plane).
# Quagga 1.2.4 zebra leaves ip_forward alone (on the hardware boards the ASIC forwards),
# so turn the kernel into a router here: every ge*/cpu0 port routes by default.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1
# loose reverse-path filtering (asymmetric lab paths are normal)
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
# keep IPv6 on ports even while link is down / when forwarding is on
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
# management VRF: let sockets in the default VRF (sshd, vtysh, telnet) accept mgmt-side connections
net.ipv4.tcp_l3mdev_accept = 1
net.ipv4.udp_l3mdev_accept = 1
net.ipv4.raw_l3mdev_accept = 1
