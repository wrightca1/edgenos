# EdgeNOS virtual switch (datapath: none — the kernel IS the forwarding plane).
# Quagga 1.2.4 zebra leaves ip_forward alone (on the hardware boards the ASIC forwards),
# so turn the kernel into a router here: every ge*/cpu0 port routes by default.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1
# No reverse-path filtering: this is a router (Cumulus ships 0 too). systemd's 50-default.conf sets
# net.ipv4.conf.*.rp_filter = 2 (loose) and applies it per interface as they appear, which silently
# dropped e.g. the 192.0.0.8-sourced ICMP TTL-exceeded of unnumbered BGP hops arriving on VLAN
# subinterfaces (traceroute showed * for the far-side border). This file sorts after 50-default
# (installed as /etc/sysctl.d/90-edgenos.conf) and carries the same glob, so new interfaces get 0.
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
net.ipv4.conf.*.rp_filter = 0
# keep IPv6 on ports even while link is down / when forwarding is on
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
# management VRF: let sockets in the default VRF (sshd, vtysh, telnet) accept mgmt-side connections
net.ipv4.tcp_l3mdev_accept = 1
net.ipv4.udp_l3mdev_accept = 1
net.ipv4.raw_l3mdev_accept = 1
