# systemd drop-in for frr.service on the EdgeNOS virtual switch: start after port naming +
# the startup-config (bridges/VXLAN/VRFs must exist), restart on failure.
[Unit]
After=edgenos-ports.service edgenos-startup.service systemd-networkd.service
Wants=edgenos-ports.service

[Service]
Restart=on-failure
RestartSec=3
