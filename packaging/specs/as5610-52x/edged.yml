# EdgeNOS package: edged (BCM56846 datapath daemon) — built from the unified tree.
#
# Build the binary first:  build/build-sdk-and-edged.sh   -> edgenos/output/edged
# Then package (from the repo top):
#   bin/edgenos pkg build packaging/specs/as5610-52x/edged.yml \
#       --source-root /home/smiley/edgecore --arch powerpc --asic bcm56846
#
name: edged
summary: BCM56846 (Trident+) switch datapath daemon — mirrors kernel FIB to the ASIC
type: overlay                 # composes into the base image, AND installable live
runtime_installable: true
asic: bcm56846                # pin: this binary only runs on Trident+ silicon
depends:
  - linux-kernel-bde
  - linux-user-bde

files:
  - src: edgenos/output/edged                                   # from-source build (build-sdk-and-edged.sh)
    dst: /usr/sbin/edged
    mode: "0755"
  - src: edgenos/platform/accton-as5610-52x/config/config.bcm
    dst: /etc/edged/config.bcm
    mode: "0644"
  - src: edgenos/platform/accton-as5610-52x/services/edged.service
    dst: /etc/systemd/system/edged.service
    mode: "0644"

hooks:
  postinst: |
    #!/bin/sh
    # Reload + (re)start the datapath after a live install.
    systemctl daemon-reload 2>/dev/null || true
    systemctl enable edged  2>/dev/null || true
    systemctl restart edged 2>/dev/null || true
  prerm: |
    #!/bin/sh
    systemctl stop edged 2>/dev/null || true
