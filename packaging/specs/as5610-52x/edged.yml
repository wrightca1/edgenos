# EdgeNOS package spec: edged (BCM56846 datapath daemon)
#
# Build with --source-root pointing at the newnos/ tree (where the artifacts live
# today) and --platform to tag arch/asic from the switch DB:
#
#   bin/edgenos pkg build packaging/specs/edged.yml \
#       --source-root ../newnos --platform powerpc-accton_as5610_52x-r0
#
name: edged
summary: BCM56846 (Trident+) switch datapath daemon — mirrors kernel FIB to the ASIC
type: overlay                 # composes into the base image, AND installable live
runtime_installable: true
asic: bcm56846                # pin: this binary only runs on Trident+ silicon
# arch is taken from --platform (powerpc) at build time
depends:
  - linux-kernel-bde
  - linux-user-bde

files:
  - src: output/edged-rebuilt
    dst: /usr/sbin/edged
    mode: "0755"
  - src: config/bcm/config.bcm
    dst: /etc/edged/config.bcm
    mode: "0644"
  - src: config/rootfs/overlay/etc/systemd/system/edged.service
    dst: /etc/systemd/system/edged.service
    mode: "0644"

hooks:
  postinst: |
    #!/bin/sh
    # Reload + (re)start the datapath after a live install.
    systemctl daemon-reload 2>/dev/null || true
    systemctl enable edged  2>/dev/null || true
    systemctl restart edged 2>/dev/null || true
  prerm: |
    #!/bin/sh
    systemctl stop edged 2>/dev/null || true
