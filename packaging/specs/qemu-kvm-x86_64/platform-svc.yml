# EdgeNOS package: platform-svc (QEMU/KVM x86_64 virtual switch).
# Port naming (ma1 + ge0..N by PCI order), networkd defaults, the ONL-style platform
# class, and the boot-time L3 config. Build from the repo top:
#   bin/edgenos pkg build packaging/specs/qemu-kvm-x86_64/platform-svc.yml --source-root . --platform x86_64-kvm_x86_64-r0
name: platform-svc
summary: QEMU/KVM x86_64 virtual switch — port naming, networkd defaults, platform class, L3 config
type: overlay
runtime_installable: true
files:
  # the ONL-style platform layer
  - {src: platform/qemu-kvm-x86_64/platform.py, dst: /usr/lib/edgenos/platform/platform.py, mode: "0644"}
  - {src: core/platform/base.py,                 dst: /usr/lib/edgenos/platform/base.py, mode: "0644"}
  - {src: core/platform/current.py,              dst: /usr/lib/edgenos/platform/current.py, mode: "0644"}
  # port naming + L3 config
  - {src: platform/qemu-kvm-x86_64/services/edgenos-ports.sh,        dst: /opt/edgenos/edgenos-ports.sh, mode: "0755"}
  - {src: platform/qemu-kvm-x86_64/services/edgenos-ports.service,   dst: /etc/systemd/system/edgenos-ports.service, mode: "0644"}
  - {src: platform/qemu-kvm-x86_64/services/edgenos-l3-config.sh,    dst: /opt/edgenos/edgenos-l3-config.sh, mode: "0755"}
  - {src: platform/qemu-kvm-x86_64/services/edgenos-l3.service,      dst: /etc/systemd/system/edgenos-l3.service, mode: "0644"}
  - {src: platform/qemu-kvm-x86_64/config/addrs.conf,                dst: /etc/edged/addrs.conf, mode: "0644"}
  - {src: platform/qemu-kvm-x86_64/config/routes.conf,               dst: /etc/edged/routes.conf, mode: "0644"}
  # networkd: ma1 DHCP, ge* up/unaddressed
  - {src: platform/qemu-kvm-x86_64/config/network/05-mgmt.netdev,    dst: /etc/systemd/network/05-mgmt.netdev, mode: "0644"}
  - {src: platform/qemu-kvm-x86_64/config/network/05-mgmt.network,   dst: /etc/systemd/network/05-mgmt.network, mode: "0644"}
  - {src: platform/qemu-kvm-x86_64/config/network/10-ma1.network,    dst: /etc/systemd/network/10-ma1.network, mode: "0644"}
  - {src: platform/qemu-kvm-x86_64/config/network/20-ge.network,     dst: /etc/systemd/network/20-ge.network, mode: "0644"}
  - {src: platform/qemu-kvm-x86_64/config/issue,                     dst: /etc/issue, mode: "0644"}
  # kernel datapath: forwarding on (zebra 1.2.4 doesn't do it; the ASIC did on the hardware boards)
  - {src: platform/qemu-kvm-x86_64/config/sysctl-edgenos.conf,       dst: /etc/sysctl.d/10-edgenos.conf, mode: "0644"}
links:
  - {dst: /etc/systemd/system/sysinit.target.wants/edgenos-ports.service,   target: /etc/systemd/system/edgenos-ports.service}
  - {dst: /etc/systemd/system/multi-user.target.wants/edgenos-l3.service,   target: /etc/systemd/system/edgenos-l3.service}
