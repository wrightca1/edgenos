# EdgeNOS package: quagga (AS4610 control plane, arm). arch-specific, asic=any.
name: quagga
summary: Quagga control plane (zebra + ospfd), ARM
type: overlay
runtime_installable: true
files:
  - {src: edgecore-4610-54t/nos/datapath/routing/zebra-arm, dst: /opt/edgenos/zebra-arm, mode: "0755"}
  - {src: edgecore-4610-54t/nos/datapath/routing/ospfd-arm, dst: /opt/edgenos/ospfd-arm, mode: "0755"}
  - {src: edgenos/platform/accton-as4610-54/config/zebra.conf, dst: /etc/quagga/zebra.conf, mode: "0644"}
  - {src: edgenos/platform/accton-as4610-54/config/ospfd.conf, dst: /etc/quagga/ospfd.conf, mode: "0644"}
  - {src: edgenos/platform/accton-as4610-54/services/zebra.service, dst: /etc/systemd/system/zebra.service, mode: "0644"}
  - {src: edgenos/platform/accton-as4610-54/services/ospfd.service, dst: /etc/systemd/system/ospfd.service, mode: "0644"}
