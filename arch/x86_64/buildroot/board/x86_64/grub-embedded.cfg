# EdgeNOS GRUB embedded (early) config — built into core.img / bootx64.efi.
# Finds the EDGENOS-BOOT partition by label on whatever disk/bus the VM or switch
# presents, then hands over to the real grub.cfg stored there.
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
search --no-floppy --label EDGENOS-BOOT --set=root
if [ -z "$root" ]; then
    echo "EdgeNOS: EDGENOS-BOOT partition not found"
    sleep 5
fi
set prefix=($root)/grub
configfile ($root)/grub/grub.cfg
