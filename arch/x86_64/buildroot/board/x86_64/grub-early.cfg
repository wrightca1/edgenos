# EdgeNOS GRUB early config — lives INSIDE the GRUB images (memdisk, prefix=(memdisk)/boot/grub),
# so it always runs under the full script parser, whatever disk or firmware the VM/switch has.
# Finds EDGENOS-BOOT by label (with retries: some firmware/virtio paths need a moment) and hands
# over to the real menu stored there (/grub/grub.cfg).
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set edgenos_found=0
for i in 1 2 3 4 5 6 7 8; do
    if search --no-floppy --label EDGENOS-BOOT --set=root; then
        set edgenos_found=1
        break
    fi
    sleep 1
done
if [ "$edgenos_found" = 1 ]; then
    set prefix=($root)/grub
    configfile ($root)/grub/grub.cfg
fi
echo "EdgeNOS: EDGENOS-BOOT partition not found (root=$root) — dropping to the GRUB shell"
sleep 5
